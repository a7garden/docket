name: release

# v* 태그를 밀거나 Actions 에서 손으로 돌리면 Windows 설치 파일(NSIS)을 만들어 릴리즈에 올린다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: docket v__VERSION__
          releaseBody: Windows 설치 파일은 아래 `docket_*_x64-setup.exe` 를 받아 실행한다.
          releaseDraft: false
          prerelease: false
